# netlify.toml — TatoIQ on Netlify.
#
# DIFFERENCE FROM FIREBASE
# Firebase Hosting serves the STATIC EXPORT (`npm run build:site` -> `out/`),
# where /leads and /api/leads are parked and therefore absent.
# Netlify instead runs the normal SERVER build with @netlify/plugin-nextjs, so
# the lead-generation routes and /api/assistant are real, working endpoints.
#
# This file is the repo-root config Netlify reads. The `.netlify/netlify.toml`
# beside it is generated by the Netlify UI and must not be hand-edited.

[build]
  # The Windows symlink workaround must run AFTER `next build` has produced
  # .next/standalone and BEFORE @netlify/plugin-nextjs copies it. Chaining it
  # into the build command is the only hook that lands in that window.
  command = "npm run build && node scripts/dereference-standalone.mjs"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # The lead feature has no identity provider wired up yet. `getSession()`
  # (src/lib/auth/session.ts) returns a clearly-labelled mock ADMIN when this
  # is on, and would otherwise show "Access denied" on every /leads request in
  # a production build. It is scoped to this demo host; a real deployment
  # replaces it with Auth.js and leaves this unset.
  ALLOW_MOCK_AUTH = "true"
  # No database is attached. With DATABASE_URL unset the lead repository serves
  # deterministic synthetic fixtures in mock mode and the UI shows a badge
  # saying so. Nothing here fabricates live records.

# Custom functions live beside the Next.js app. `cco-triage` declares its own
# path (`/api/cco/triage`) in the function file, so no redirect is needed.
# The Next.js plugin's generated functions stay in .netlify/functions-internal.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# @netlify/plugin-nextjs is declared per-site in the Netlify UI
# (.netlify/netlify.toml). It is re-declared here so a fresh clone builds
# correctly without re-linking the site.

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ── Security headers ────────────────────────────────────────────────────────
# Mirrors firebase.json so both hosts carry the same posture. Keep in sync.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-DNS-Prefetch-Control = "off"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.cloudfunctions.net https://web-app---tato.web.app https://tatoiq.netlify.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icon"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/apple-icon"
  [headers.values]
    Cache-Control = "public, max-age=604800"
